[package]
name = "rtsp-viewer"
description = "Client leve para câmeras RTSP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rtsp-viewer-core.workspace = true
rtsp-viewer-media.workspace = true
slint.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
keyring-core = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
serde_json = "1.0"
