[workspace]
resolver = "3"
members = ["crates/core", "crates/media", "crates/onvif", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
rtsp-viewer-core = { path = "crates/core" }
rtsp-viewer-media = { path = "crates/media" }
rtsp-viewer-onvif = { path = "crates/onvif" }

ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
slint = "1.19"
slint-build = "1.19"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
