# Câmera falsa: MediaMTX + publicadores ffmpeg com padrão de teste e relógio.
#   docker compose -f test-camera/compose.yaml up -d
# Caminhos: rtsp://localhost:8554/h264, /h265 e /auth (usuário teste, senha teste123).
# O relógio na imagem (UTC, com milissegundos) serve para medir latência.
name: rtsp-viewer-test-camera

x-publisher: &publisher
  image: lscr.io/linuxserver/ffmpeg:9.0.2-cli-ls90
  restart: unless-stopped
  depends_on: [mediamtx]

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  pub-h264:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=25
      - -vf
      - drawtext=text='%{gmtime\:%T.%3N}':x=40:y=40:fontsize=64:fontcolor=white:box=1:boxcolor=black@0.7
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "25"
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/h264

  pub-h265:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=25
      - -vf
      - drawtext=text='%{gmtime\:%T.%3N}':x=40:y=40:fontsize=64:fontcolor=white:box=1:boxcolor=black@0.7
      - -c:v
      - libx265
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -x265-params
      - keyint=25:log-level=error
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/h265

  pub-auth:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=640x360:rate=15
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "15"
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/auth
