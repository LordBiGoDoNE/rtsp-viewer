# Câmera falsa: MediaMTX + publicadores ffmpeg com padrão de teste e relógio.
#   docker compose -f test-camera/compose.yaml up -d
# Caminhos: rtsp://localhost:8554/h264, /h265 e /auth (usuário teste, senha teste123).
# O relógio na imagem (UTC, com milissegundos) serve para medir latência.
name: rtsp-viewer-test-camera

x-publisher: &publisher
  image: lscr.io/linuxserver/ffmpeg:9.0.2-cli-ls90
  restart: unless-stopped
  depends_on: [mediamtx]

configs:
  mediamtx:
    # Configuração embutida (sem bind mount), para funcionar também quando o
    # compose roda de dentro de um contêiner, como no act.
    content: |
      # Câmera falsa local para testes do rtsp-viewer.
      # Credenciais abaixo são fictícias e servem só para testar autenticação.
      logLevel: info

      rtsp: true
      rtspTransports: [tcp, udp]
      rtspAddress: :8554
      rtmp: false
      hls: false
      webrtc: false
      srt: false
      api: false
      metrics: false
      playback: false

      authMethod: internal
      authInternalUsers:
        # Publicadores da rede do compose e leitura livre dos caminhos abertos.
        - user: any
          pass:
          ips: []
          permissions:
            - action: publish
            - action: read
              path: h264
            - action: read
              path: h265
            - action: read
              path: queda
        # Caminho protegido: usuário e senha fictícios.
        - user: teste
          pass: teste123
          ips: []
          permissions:
            - action: read
              path: auth

      paths:
        h264:
        h265:
        queda:
        auth:

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    restart: unless-stopped
    ports:
      - "8554:8554"
    configs:
      - source: mediamtx
        target: /mediamtx.yml

  pub-h264:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=25
      - -vf
      - drawtext=text='%{gmtime\:%T.%3N}':x=40:y=40:fontsize=64:fontcolor=white:box=1:boxcolor=black@0.7
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "25"
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/h264

  pub-h265:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=25
      - -vf
      - drawtext=text='%{gmtime\:%T.%3N}':x=40:y=40:fontsize=64:fontcolor=white:box=1:boxcolor=black@0.7
      - -c:v
      - libx265
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      # GOP fechado: quadros-chave IDR, como nas câmeras IP. Com o padrão do
      # x265 (open-gop) só há CRA, que o RTSP do Media3 1.11 não reconhece como
      # quadro-chave (design D3 de app-android).
      - -x265-params
      - keyint=25:open-gop=0:log-level=error
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/h265

  pub-auth:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=640x360:rate=15
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "15"
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/auth

  # Publicador dedicado ao teste de queda e retorno (o teste para e religa).
  pub-queda:
    <<: *publisher
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=640x360:rate=15
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "15"
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/queda
