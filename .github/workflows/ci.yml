# Verificação (build, lint, testes). Não publica nada: pacotes saem só como
# artefatos do workflow. Deploy/publicação é workflow separado e manual.
name: CI

on:
  pull_request:
  push:
    branches: [main, "epic/**", "task/**", "hotfix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (FFmpeg, clang, Slint)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev

      - name: Toolchain Rust (rust-toolchain.toml) e cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: desktop
          cache-workspaces: desktop

      - name: Formatação
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Câmera falsa (MediaMTX + ffmpeg)
        working-directory: .
        run: |
          docker compose -f test-camera/compose.yaml up -d --wait mediamtx
          docker compose -f test-camera/compose.yaml up -d
          echo "RTSP_TEST_COMPOSE=$PWD/test-camera/compose.yaml" >> "$GITHUB_ENV"
          # No act o job roda num contêiner; a câmera fica no host.
          if [ -n "$ACT" ]; then
            echo "RTSP_TEST_BASE=rtsp://host.docker.internal:8554" >> "$GITHUB_ENV"
          else
            echo "RTSP_TEST_BASE=rtsp://localhost:8554" >> "$GITHUB_ENV"
          fi

      - name: Testes (inclusive player contra a câmera falsa)
        run: cargo test --workspace --locked

      - name: Logs da câmera falsa
        if: failure()
        working-directory: .
        run: docker compose -f test-camera/compose.yaml logs --tail 50

      - name: Build release
        run: cargo build --release --locked

      - name: cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb@3.8.0

      - name: Pacote .deb (Ubuntu 24.04)
        run: |
          cargo deb -p rtsp-viewer --no-build
          ls -l target/debian/*.deb
          dpkg-deb --info target/debian/*.deb | grep -E "Package|Version|Depends|Installed-Size"

      - name: Artefato .deb
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-viewer-deb
          path: desktop/target/debian/*.deb
          retention-days: 14

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Cache do FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: FFmpeg LGPL (versão fixa)
        working-directory: .
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Ambiente de build
        working-directory: .
        run: |
          . ./scripts/env.ps1
          "FFMPEG_DIR=$env:FFMPEG_DIR" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
          Join-Path $env:FFMPEG_DIR 'bin' >> $env:GITHUB_PATH

      - name: Toolchain Rust (rust-toolchain.toml) e cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: desktop
          cache-workspaces: desktop
          # Sem RUSTFLAGS da action: ele anularia o crt-static de desktop/.cargo/config.toml.
          rustflags: ""

      - name: Testes
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Pacote .zip (Windows x64)
        working-directory: .
        run: ./scripts/package-windows.ps1

      - name: Pacote sem VCRUNTIME e só com as DLLs esperadas
        working-directory: .
        run: |
          ./scripts/check-windows-package.ps1
          Get-ChildItem dist/rtsp-viewer-*-windows-x64 | Select-Object Name, Length | Format-Table -AutoSize

      - name: Artefato .zip
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-viewer-windows-x64
          path: dist/*.zip
          retention-days: 14

  # Android (ADR 0006): lint, testes JVM, cor literal e APK de release sem
  # assinatura. O CI nunca assina nem publica.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Wrapper executável (o act copia os arquivos sem o bit de execução)
        run: chmod +x gradlew

      - name: Testes do build-logic (tema gerado dos tokens)
        run: ./gradlew -p build-logic test

      - name: Testes JVM, cor literal, HTTP fora do onvif e lint
        run: ./gradlew :core:test :onvif:test :app:testDebugUnitTest :app:checkUiColors :app:checkCleartextHttp :app:lintRelease

      - name: APK de release sem assinatura e permissões do manifesto mesclado
        run: |
          ./gradlew :app:assembleRelease :app:checkReleasePermissions
          ls -l app/build/outputs/apk/release/

      - name: Artefato APK
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-viewer-android-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # Testes instrumentados num emulador, contra a câmera falsa no host
  # (10.0.2.2 dentro do emulador). Não roda no act (sem emulador no contêiner).
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Câmera falsa (MediaMTX + ffmpeg)
        run: |
          docker compose -f test-camera/compose.yaml up -d --wait mediamtx
          docker compose -f test-camera/compose.yaml up -d

      - name: Testes instrumentados (emulador API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.rtspBase=rtsp://10.0.2.2:8554

      - name: Logs da câmera falsa
        if: failure()
        run: docker compose -f test-camera/compose.yaml logs --tail 50

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenSpec
        run: npm install -g @fission-ai/openspec@2.1.1

      - name: Validar specs e changes
        run: openspec validate --all --strict --no-interactive

      - name: Testes do script de checagem
        run: node --test scripts/check-openspec.test.mjs

      - name: Changes entregues e registro de entregas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            git fetch --no-tags origin main
            node scripts/check-openspec.mjs --base origin/main
          else
            node scripts/check-openspec.mjs
          fi
